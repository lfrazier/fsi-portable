site_name: FSI Portable
site_url: https://example.local
theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - content.code.copy
    - content.tooltips
    - search.suggest
    - search.highlight
  toc:
    permalink: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - footnotes
  - def_list
  - attr_list
plugins:
  - search
  # Optional: add PWA for offline install. After installing the plugin, uncomment:
  # - pwa:
  #     manifest:
  #       name: "FSI Portable"
  #       short_name: "FSI"
  #       start_url: "/"
  #       display: "standalone"
  #       background_color: "#ffffff"
  #       theme_color: "#222222"
